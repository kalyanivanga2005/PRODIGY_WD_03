<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================================
         GAME CONTAINER
    ========================================= -->

    <div class="game-container">

        <h1>🎮 Tic-Tac-Toe</h1>


        <!-- ====================================
             SCOREBOARD
        ===================================== -->

        <div class="scoreboard">

            <div class="score-box">

                <span class="score-label">
                    ❌ Player X
                </span>

                <span
                    class="score-number"
                    id="xScore">
                    0
                </span>

            </div>


            <div class="score-box">

                <span class="score-label">
                    🤝 Draws
                </span>

                <span
                    class="score-number"
                    id="drawScore">
                    0
                </span>

            </div>


            <div class="score-box">

                <span class="score-label">
                    ⭕ Player O
                </span>

                <span
                    class="score-number"
                    id="oScore">
                    0
                </span>

            </div>

        </div>


        <!-- ====================================
             SOUND BUTTON
        ===================================== -->

        <div class="sound-control">

            <button
                class="sound-btn"
                id="soundBtn">

                🔊 Sound On

            </button>

        </div>


        <!-- ====================================
             GAME MODE
        ===================================== -->

        <div class="mode-selection">

            <button
                class="mode-btn active"
                data-mode="2player">

                👥 2 Players

            </button>


            <button
                class="mode-btn"
                data-mode="computer">

                🤖 Vs Computer

            </button>

        </div>


        <!-- ====================================
             STATUS
        ===================================== -->

        <p
            class="status"
            id="status">

            Player X's Turn

        </p>


        <!-- ====================================
             GAME BOARD
        ===================================== -->

        <div class="game-board">

            <button
                class="cell"
                data-index="0">
            </button>

            <button
                class="cell"
                data-index="1">
            </button>

            <button
                class="cell"
                data-index="2">
            </button>

            <button
                class="cell"
                data-index="3">
            </button>

            <button
                class="cell"
                data-index="4">
            </button>

            <button
                class="cell"
                data-index="5">
            </button>

            <button
                class="cell"
                data-index="6">
            </button>

            <button
                class="cell"
                data-index="7">
            </button>

            <button
                class="cell"
                data-index="8">
            </button>

        </div>


        <!-- ====================================
             GAME BUTTONS
        ===================================== -->

        <div class="game-buttons">

            <button
                class="restart-btn"
                id="restartBtn">

                🔄 Restart

            </button>


            <button
                class="reset-score-btn"
                id="resetScoreBtn">

                🧹 Reset Scores

            </button>

        </div>

    </div>


    <!-- ========================================
         RESULT POPUP
    ========================================= -->

    <div
        class="result-overlay"
        id="resultOverlay">

        <div class="result-popup">

            <div
                class="result-icon"
                id="resultIcon">

                🏆

            </div>


            <h2 id="resultTitle">
                Player X Wins!
            </h2>


            <p id="resultMessage">
                Great Game! 🎉
            </p>


            <button
                class="new-game-btn"
                id="newGameBtn">

                🎮 New Game

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
